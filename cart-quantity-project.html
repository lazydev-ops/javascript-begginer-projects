<!DOCTYPE html>
<head>

</head>
<body>
  <h1 style="text-align: center;">Cart Quantity Project </h1>
  <button onclick="
  if (result + 1 > 10) {
    alert('the cart is full');
  }
  else {
  result = result + 1;
  
  }
  updateCart();
  ">
  Add to Cart</button>
  <button onclick="
  if(result + 4 > 10) {
    alert('the cart is full');
  }
  else{
  result += 4;
  console.log(`cartquantity: ${result}`);}
  updateCart();"> 
  +4 </button>
  <button onclick="
  if(result + 5 > 10) {
    alert('the cart is full');
  }
  else{
  result += 5;
  console.log(`cartquantity : ${result}`);}
  updateCart();
  ">
   +5 </button>
  <button onclick="if(result - 1 < 0) {
    alert('the cart is empty');
  }
  else{
  result -= 1;
  console.log(`cartquantity: ${result}`)
  }  
  updateCart();">
  Remove from cart</button>
  <button onclick="if(result - 2 < 0) {
    alert('the cart is empty');
  }
  else{
  result -= 2;
  console.log(`cartquantity: ${result}`)}
    updateCart();
  ">
  -2</button>
  <button onclick="if(result - 3 < 0) {
    alert('the cart is empty');
  }
  else{
  result -= 3;
  console.log(`cartquantity: ${result}`)}
  updateCart();
  ">
  -3</button>
  <h3 class="js-cart-display"></h3>
    <script>
      let result = 0;
      updateCart();
     function updateCart () {
     document.querySelector('.js-cart-display').innerHTML= `cart quantity: ${result}`;
     }  
    </script>
</body>

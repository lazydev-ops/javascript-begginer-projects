<!DOCTYPE html>
<head>
  <style>
.style-cost-input {
      font-size: 1.4rem;
      border-color: 1px solid #787676;
      padding-left: 10px;
      padding-right: 10px;
      padding-top: 5px;
      padding-bottom: 5px;
    }
    .style-calculate {
      border: none;
      color: #ffff;
      font-size: 1.2rem;
      background-color: rgb(27, 183, 27);
      padding-top: 9px;
      padding-bottom: 9px;
      padding-right: 14px;
      padding-left: 14px;
    }
  </style>
</head>
<body>
  <h1>Amazon Shipping Calculator</h1>
<br>
<h2>
  Order under $40 = +$10 Shipping charges
   <br>
  Order above $40 = $0 Shipping charges
</h2>
<input placeholder="Cost of Order"  class="js-cost-input style-cost-input" onkeydown="updateOnkeydown(event);"> 
<button class="style-calculate" onclick="updateCalculation();">
Calculate</button>  
<h3 class="js-calculate"></h3>
<script>
  function updateOnkeydown (event) {
    if (event.key === 'Enter') {
      updateCalculation();
    }
  }
function updateCalculation () {
  const inputElement = document.querySelector('.js-cost-input');
  let cost = Number(inputElement.value);
  if (cost < 40) {
  cost += 10;
  }
  document.querySelector('.js-calculate').innerHTML =`${cost}`;
}
else {
 
}
 </script>  
</body>
</html>
